name: WiA Order 003 Materialize Canonical Source

on:
  push:
    branches: [feat/wia-complete-end-to-end-v1]
    paths:
      - .github/workflows/order-003-materialize.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: wia-order-003-materialize
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wia-complete-end-to-end-v1
  ISSUE_NUMBER: "3"
  ARCHIVE_SHA256: 8bf186dc8eb35b08d2d85f161f129c1188328807eb8db3ee5972489527510428
  FACE_WEBP_SHA256: 1585c0be43ef35cce9154026759f3dcd649748a3e9dc248543c237b27d37debf

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout staged branch
        uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0

      - name: Decode, verify and materialize exact project
        id: materialize
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT

          cat ops/materialize-order003/source-*.b64 | base64 -d > "$tmp/source.tar.gz"
          archive_sha=$(sha256sum "$tmp/source.tar.gz" | awk '{print $1}')
          test "$archive_sha" = "$ARCHIVE_SHA256"
          tar -tzf "$tmp/source.tar.gz" > "$tmp/archive-list.txt"
          mkdir -p "$tmp/source"
          tar -xzf "$tmp/source.tar.gz" -C "$tmp/source"

          test -s "$tmp/source/src/index.js"
          test -s "$tmp/source/public/index.html"
          test -s "$tmp/source/public/app.js"
          test -s "$tmp/source/public/styles.css"
          test -s "$tmp/source/public/voice-selector.js"
          test -s "$tmp/source/public/assets/wia-face-order003.webp"
          test -s "$tmp/source/.github/workflows/order-003-validate-deploy.yml"
          test -s "$tmp/source/package-lock.json"
          test -s "$tmp/source/wrangler.jsonc"
          grep -q 'WIA-COMPLETE-END-TO-END-V1' "$tmp/source/src/index.js"
          grep -q 'WIA_COMPLETE_END_TO_END_V1' "$tmp/source/src/index.js"
          grep -q 'explicit_opt_in' "$tmp/source/src/index.js"
          grep -q '280' "$tmp/source/public/app.js"
          grep -q 'roastToggle' "$tmp/source/public/index.html"

          # Deterministic archive repair: build gate originally referenced the face
          # at public/ instead of the canonical public/assets/ location.
          sed -i \
            -e 's#public/wia-face-order003\.webp#public/assets/wia-face-order003.webp#g' \
            -e 's#public/wia-face-order003\.png#public/assets/wia-face-order003.png#g' \
            "$tmp/source/tests/build.mjs"
          grep -q 'public/assets/wia-face-order003.webp' "$tmp/source/tests/build.mjs"
          grep -q 'public/assets/wia-face-order003.png' "$tmp/source/tests/build.mjs"

          face_sha=$(sha256sum "$tmp/source/public/assets/wia-face-order003.webp" | awk '{print $1}')
          test "$face_sha" = "$FACE_WEBP_SHA256"

          sudo apt-get update -qq
          sudo apt-get install -y -qq webp imagemagick
          dwebp "$tmp/source/public/assets/wia-face-order003.webp" -o "$tmp/source/public/assets/wia-face-order003.png" >/dev/null
          test -s "$tmp/source/public/assets/wia-face-order003.png"
          mkdir -p "$tmp/source/public/icons"
          if command -v magick >/dev/null 2>&1; then
            image_tool=(magick)
          else
            image_tool=(convert)
          fi
          "${image_tool[@]}" "$tmp/source/public/assets/wia-face-order003.png" -background '#0b0712' -gravity center -extent 816x816 -resize 192x192 -strip "$tmp/source/public/icons/icon-192.png"
          "${image_tool[@]}" "$tmp/source/public/assets/wia-face-order003.png" -background '#0b0712' -gravity center -extent 816x816 -resize 512x512 -strip "$tmp/source/public/icons/icon-512.png"
          test -s "$tmp/source/public/icons/icon-192.png"
          test -s "$tmp/source/public/icons/icon-512.png"

          ARCHIVE_SHA="$archive_sha" FACE_SHA="$face_sha" python3 - "$tmp/source" <<'PY'
          import hashlib, json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          def item(relative, public_path, content_type):
              path = root / relative
              data = path.read_bytes()
              return {
                  "path": public_path,
                  "content_type": content_type,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }
          webp = item("public/assets/wia-face-order003.webp", "/assets/wia-face-order003.webp", "image/webp")
          png = item("public/assets/wia-face-order003.png", "/assets/wia-face-order003.png", "image/png")
          manifest = {
              "asset_version": "WIA_FACE_ORDER_003_V1",
              "source": "canonical WiA low-poly portrait approved as the Order 003 implementation baseline",
              "identity_policy": "single feminine purple-bob identity; no procedural fallback; no automatic triangulation",
              "source_archive_sha256": os.environ["ARCHIVE_SHA"],
              "principal": "/assets/wia-face-order003.webp",
              "fallback": "/assets/wia-face-order003.png",
              "width": 720,
              "height": 816,
              "alpha": True,
              "webp_sha256": webp["sha256"],
              "png_sha256": png["sha256"],
              "old_triangulated_assets_active": False,
              "assets": [webp, png],
          }
          target = root / "public/assets/wia-face-order003-manifest.json"
          target.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          assert webp["sha256"] == os.environ["FACE_SHA"]
          PY

          mkdir -p "$tmp/source/ops/evidence/order-003" "$tmp/source/ops/history/order-003"
          if [ -d ops/evidence/order-003/baseline ]; then
            cp -a ops/evidence/order-003/baseline "$tmp/source/ops/evidence/order-003/baseline"
          fi
          cp ops/order-003-baseline.sh "$tmp/source/ops/history/order-003/order-003-baseline.sh"
          cp .github/workflows/order-003-baseline.yml "$tmp/source/ops/history/order-003/order-003-baseline.yml"
          cp "$tmp/archive-list.txt" "$tmp/source/ops/history/order-003/materialized-archive-files.txt"
          cat > "$tmp/source/ops/history/order-003/materialization.json" <<EOF
          {
            "claim": "WIA_ORDER_003_MATERIALIZATION",
            "archive_sha256": "$archive_sha",
            "face_webp_sha256": "$face_sha",
            "source_branch": "feat/wia-complete-end-to-end-v1",
            "source_parent_sha": "$(git rev-parse HEAD)",
            "materialized_at_utc": "$(date -u +%FT%TZ)",
            "deterministic_repairs": [
              "tests/build.mjs face paths corrected from public/ to public/assets/"
            ],
            "legacy_evidence_preserved": true,
            "bootstrap_chunks_removed_from_canonical_source": true,
            "legacy_workflows_removed_from_canonical_source": true,
            "billing_write": false,
            "secret_output": false
          }
          EOF
          sed -i 's/^          //' "$tmp/source/ops/history/order-003/materialization.json"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$tmp/source/." .

          test "$(find .github/workflows -maxdepth 1 -type f | wc -l | tr -d ' ')" = "1"
          test -f .github/workflows/order-003-validate-deploy.yml
          test ! -d ops/materialize-order003
          test ! -f .github/workflows/order-003-materialize.yml
          test ! -f .github/workflows/order-003-baseline.yml
          test -f ops/evidence/order-003/baseline/baseline.json
          test -f ops/history/order-003/order-003-baseline.yml

          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
          rm -rf node_modules dist

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: implement WiA Order 003 end-to-end'
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1

          final_sha=$(git rev-parse HEAD)
          final_tree=$(git rev-parse HEAD^{tree})
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "final_tree=$final_tree" >> "$GITHUB_OUTPUT"

      - name: Append materialization checkpoint
        shell: bash
        env:
          FINAL_SHA: ${{ steps.materialize.outputs.final_sha }}
          FINAL_TREE: ${{ steps.materialize.outputs.final_tree }}
        run: |
          set -Eeuo pipefail
          cat > "$RUNNER_TEMP/checkpoint.txt" <<EOF
          ARQ_ORDER_003_MATERIALIZED

          TIMESTAMP_UTC=$(date -u +%FT%TZ)
          STATUS=PASS
          PHASE=PHASE_2_CANONICAL_SOURCE_MATERIALIZED
          BRANCH=$TARGET_BRANCH
          HEAD_SHA=$FINAL_SHA
          TREE_SHA=$FINAL_TREE
          ARCHIVE_SHA256=$ARCHIVE_SHA256
          FACE_WEBP_SHA256=$FACE_WEBP_SHA256
          OLD_BOOTSTRAP_CHUNKS_ACTIVE=FALSE
          LEGACY_WORKFLOWS_ACTIVE_ON_CANONICAL_BRANCH=FALSE
          BASELINE_EVIDENCE_PRESERVED=TRUE
          SOURCE_CHECK=PASS
          TESTS=PASS
          BUILD=PASS
          ZERO_COST=PASS
          BILLING_WRITE=FALSE
          SECRET_OUTPUT=FALSE
          NEXT_PHASE=ORDER_003_VALIDATE_DEPLOY_WORKFLOW
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/checkpoint.txt"
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/checkpoint.txt"

      - name: Append precise materialization blocker
        if: failure()
        shell: bash
        run: |
          set +x
          cat > "$RUNNER_TEMP/blocker.txt" <<EOF
          WIA_ORDER_003_CHECKPOINT

          STATUS=BLOCKED
          BLOCKING_PHASE=PHASE_2_CANONICAL_SOURCE_MATERIALIZATION
          BLOCKING_GATE=MATERIALIZE_VERIFY_TEST_BUILD
          EXACT_ERROR=The first failing command and sanitized output are preserved in GitHub Actions run $GITHUB_RUN_ID.
          COMMAND_OR_REQUEST=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          CURRENT_SOURCE_SHA=$GITHUB_SHA
          REMOTE_STATE=NOT_MUTATED_BY_MATERIALIZATION
          GITHUB_MAIN_STATE=UNTOUCHED
          COST_STATE=ZERO_COST_NO_BILLING_OPERATION
          SECRET_STATE=NO_SECRET_VALUE_INTENTIONALLY_OUTPUT
          MINIMUM_REQUIRED_RECOVERY=Correct only the first failing materialization command in run $GITHUB_RUN_ID and rerun the same deterministic archive.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/blocker.txt"
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/blocker.txt"
