name: WiA Order 003 Baseline Reconstruction

on:
  push:
    branches: [feat/wia-complete-end-to-end-v1]
    paths: [.github/workflows/order-003-baseline.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: wia-order-003-baseline
  cancel-in-progress: false

env:
  BASE_URL: https://wia.simondalmasso44.workers.dev
  WORKER_NAME: wia
  ISSUE_NUMBER: "3"
  TARGET_BRANCH: feat/wia-complete-end-to-end-v1
  BASELINE_SHA: 2d838982f6812a4ffdc3fa3e53290c9da6c08b0d

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.DEPLOY_NOW }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0

      - name: Capture public and authenticated state
        shell: bash
        run: bash ops/order-003-baseline.sh

      - name: Preserve evidence and publish material checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          source ops/evidence/order-003/baseline/status.env
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/order-003/baseline
          git commit -m 'docs: preserve Order 003 authenticated baseline [skip ci]'
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1
          EVIDENCE_SHA=$(git rev-parse HEAD)

          if [ "$STATUS" = PASS ]; then
            cat > "$RUNNER_TEMP/comment.txt" <<EOF
          ARQ_ORDER_003_BASELINE

          TIMESTAMP_UTC=$CAPTURED
          STATUS=PASS
          PHASE=PHASE_1_REMOTE_GITHUB_CLOUDFLARE_RECONSTRUCTION
          SOURCE_BRANCH=$TARGET_BRANCH
          BASELINE_SOURCE_SHA=$BASELINE_SHA
          EVIDENCE_COMMIT_SHA=$EVIDENCE_SHA
          MAIN_SHA=$MAIN_SHA
          REMOTE_WORKSET=$WORKSET
          REMOTE_MARKER=$MARKER
          REMOTE_MODEL=$MODEL
          ACTIVE_DEPLOYMENT_ID=$DEPLOYMENT_ID
          ACTIVE_VERSION_ID=$VERSION_ID
          DEPLOYMENT_CREATED_AT=$DEPLOYMENT_CREATED_AT
          REMOTE_ROOT=PASS
          REMOTE_HEALTH=PASS
          REMOTE_CHAT_1=PASS_MODEL_$CHAT1_MODEL
          REMOTE_CHAT_2=PASS_MODEL_$CHAT2_MODEL
          PUBLIC_SOURCE_MATCH=$SOURCE_MATCH
          CURRENT_KNOWN_BROWSER_DEFECT=FACE_ELEMENT_NEVER_STABLE_DUE_CONTINUOUS_TRANSFORM_ANIMATION
          CURRENT_KNOWN_UX_VERDICT=FACE_AND_VOICE_NOT_HUMAN_APPROVED
          WORKFLOW_INVENTORY=6_ACTIVE_LEGACY_OR_ONE_SHOT_WORKFLOWS
          OPEN_PRS=0
          ZERO_COST=PASS_NO_BILLING_ENDPOINT_CALLED
          SECRET_STATE=PASS_NO_SECRET_VALUE_PERSISTED
          EVIDENCE_ROOT=ops/evidence/order-003/baseline/
          NEXT_PHASE=PHASE_2_CANONICAL_BASELINE_AND_CLEANUP_PLAN
          EOF
          else
            CHAT1_HTTP=$(jq -r '.status // 0' ops/evidence/order-003/baseline/chat-identity.meta.json 2>/dev/null || echo 0)
            CHAT2_HTTP=$(jq -r '.status // 0' ops/evidence/order-003/baseline/chat-criterion.meta.json 2>/dev/null || echo 0)
            cat > "$RUNNER_TEMP/comment.txt" <<EOF
          WIA_ORDER_003_CHECKPOINT

          STATUS=BLOCKED
          BLOCKING_PHASE=PHASE_1_REMOTE_GITHUB_CLOUDFLARE_RECONSTRUCTION
          BLOCKING_GATE=$FAILURE_STEP
          EXACT_ERROR=$FAILURE_ERROR
          COMMAND_OR_REQUEST=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          CURRENT_SOURCE_SHA=$SOURCE_SHA
          EVIDENCE_COMMIT_SHA=$EVIDENCE_SHA
          CHAT_IDENTITY_HTTP=$CHAT1_HTTP
          CHAT_CRITERION_HTTP=$CHAT2_HTTP
          ACTIVE_DEPLOYMENT_ID=$DEPLOYMENT_ID
          ACTIVE_VERSION_ID=$VERSION_ID
          REMOTE_STATE=NOT_MUTATED_BY_THIS_WORKFLOW
          COST_STATE=ZERO_COST_NO_BILLING_OPERATION
          SECRET_STATE=PASS_NO_SECRET_VALUE_PERSISTED
          EVIDENCE_PATH=ops/evidence/order-003/baseline/
          WHY_CONTINUATION_IS_UNSAFE_OR_INVALID=Fresh baseline did not satisfy every identity gate.
          MINIMUM_REQUIRED_RECOVERY=Correct or revalidate only $FAILURE_STEP using the preserved evidence commit $EVIDENCE_SHA.
          EOF
          fi
          sed -i 's/^          //' "$RUNNER_TEMP/comment.txt"
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.txt"
          test "$STATUS" = PASS
