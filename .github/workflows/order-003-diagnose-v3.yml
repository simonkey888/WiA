name: WiA Order 003 Materialization Diagnostic V3

on:
  push:
    branches: [feat/wia-complete-end-to-end-v1]
    paths: [.github/workflows/order-003-diagnose-v3.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Reproduce without losing causal result
        shell: bash
        run: |
          set -u
          mkdir -p ops/evidence/order-003/diagnostic
          rm -f /tmp/order003-failure.env
          cat > /tmp/reproduce.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          tmp=$(mktemp -d)
          cleanup(){ rm -rf "$tmp"; }
          trap cleanup EXIT
          fail(){ rc=$?; printf 'FAILED_LINE=%q\nFAILED_COMMAND=%q\nEXIT_CODE=%q\n' "$1" "$2" "$rc" > /tmp/order003-failure.env; exit "$rc"; }
          trap 'fail "$LINENO" "$BASH_COMMAND"' ERR

          echo STEP=DECODE
          cat ops/materialize-order003/source-*.b64 | base64 -d > "$tmp/source.tar.gz"
          actual_sha=$(sha256sum "$tmp/source.tar.gz" | awk '{print $1}')
          echo ARCHIVE_SHA256="$actual_sha"
          test "$actual_sha" = "8bf186dc8eb35b08d2d85f161f129c1188328807eb8db3ee5972489527510428"

          echo STEP=EXTRACT
          mkdir -p "$tmp/source"
          tar -xzf "$tmp/source.tar.gz" -C "$tmp/source"

          echo STEP=REPAIR
          sed -i -e 's#public/wia-face-order003\.webp#public/assets/wia-face-order003.webp#g' -e 's#public/wia-face-order003\.png#public/assets/wia-face-order003.png#g' "$tmp/source/tests/build.mjs"
          grep -q 'public/assets/wia-face-order003.webp' "$tmp/source/tests/build.mjs"
          grep -q 'public/assets/wia-face-order003.png' "$tmp/source/tests/build.mjs"

          echo STEP=ASSETS
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp imagemagick
          dwebp "$tmp/source/public/assets/wia-face-order003.webp" -o "$tmp/source/public/assets/wia-face-order003.png" >/dev/null
          mkdir -p "$tmp/source/public/icons"
          if command -v magick >/dev/null 2>&1; then image_tool=(magick); else image_tool=(convert); fi
          "${image_tool[@]}" "$tmp/source/public/assets/wia-face-order003.png" -background '#0b0712' -gravity center -extent 816x816 -resize 192x192 -strip "$tmp/source/public/icons/icon-192.png"
          "${image_tool[@]}" "$tmp/source/public/assets/wia-face-order003.png" -background '#0b0712' -gravity center -extent 816x816 -resize 512x512 -strip "$tmp/source/public/icons/icon-512.png"

          cd "$tmp/source"
          echo STEP=NPM_CI
          npm ci --ignore-scripts --no-audit --no-fund
          echo STEP=CHECK
          npm run check
          echo STEP=TEST
          npm test
          echo STEP=BUILD
          npm run build
          echo STEP=PASS
          SCRIPT
          chmod +x /tmp/reproduce.sh

          set +e
          /tmp/reproduce.sh > ops/evidence/order-003/diagnostic/reproduction.log 2>&1
          rc=$?
          set -e

          if [ -f /tmp/order003-failure.env ]; then source /tmp/order003-failure.env; else FAILED_LINE=0; FAILED_COMMAND=NONE; EXIT_CODE=$rc; fi
          STATUS=PASS
          [ "$rc" = 0 ] || STATUS=BLOCKED
          jq -n --arg status "$STATUS" --argjson exit_code "$rc" --arg failed_line "$FAILED_LINE" --arg failed_command "$FAILED_COMMAND" --arg run_url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg current_sha "$GITHUB_SHA" '{claim:"WIA_ORDER_003_MATERIALIZATION_DIAGNOSTIC",status:$status,exit_code:$exit_code,failed_line:$failed_line,failed_command:$failed_command,run_url:$run_url,current_sha:$current_sha,remote_mutated:false,billing_write:false,secret_output:false}' > ops/evidence/order-003/diagnostic/result.json

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/order-003/diagnostic
          git commit -m 'docs: preserve Order 003 materialization diagnostic [skip ci]'
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1

          cat > "$RUNNER_TEMP/comment.txt" <<EOF
          ARQ_ORDER_003_DIAGNOSTIC_V3

          STATUS=$STATUS
          EXIT_CODE=$rc
          FAILED_LINE=$FAILED_LINE
          FAILED_COMMAND=$FAILED_COMMAND
          EVIDENCE_COMMIT=$(git rev-parse HEAD)
          EVIDENCE_PATH=ops/evidence/order-003/diagnostic/
          RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          REMOTE_STATE=UNCHANGED
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/comment.txt"
          gh issue comment 3 --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.txt"
