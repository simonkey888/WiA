name: WiA Order 003 Terminal Cleanup

on:
  push:
    branches: [feat/wia-complete-end-to-end-v1]
    paths: [.github/workflows/order-003-cleanup.yml]

permissions:
  contents: write

concurrency:
  group: wia-order-003-terminal-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0
      - name: Remove obsolete executable machinery while preserving evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f \
            .github/workflows/bootstrap-wia-v1-1.yml \
            .github/workflows/deploy-now.yml \
            .github/workflows/deploy-wia-fallback.yml \
            .github/workflows/deploy-wia.yml \
            .github/workflows/execute-wia-v1-1.yml \
            .github/workflows/order-003-baseline.yml \
            .github/workflows/order-003-chat-diagnostic.yml \
            .github/workflows/order-003-diagnose.yml \
            .github/workflows/order-003-diagnose-v2.yml \
            .github/workflows/order-003-diagnose-v3.yml \
            .github/workflows/order-003-finalize.yml \
            .github/workflows/order-003-materialize.yml \
            .github/workflows/order-003-model-catalog.yml \
            .github/workflows/order-003-validate-deploy.yml \
            ops/order-003-baseline.sh \
            ops/run-wia-v1-1.sh \
            ops/materialize-order003/source-000.b64 \
            ops/materialize-order003/source-001.b64 \
            ops/materialize-order003/source-002.b64 \
            ops/materialize-order003/source-003.b64 \
            ops/materialize-order003/source-004.b64 \
            ops/materialize-order003/source-005.b64 \
            ops/materialize-order003/source-007.b64 \
            ops/materialize-order003/source-008.b64 \
            ops/materialize-order003/source-009.b64 \
            ops/materialize-order003/source-010.b64 \
            .github/workflows/order-003-cleanup.yml
          test -f .github/workflows/deploy.yml
          test -f ops/evidence/order-003/final/result.json
          test -f ops/HISTORY_ORDER_003.md
          git commit -m 'chore: remove superseded Order 003 bootstrap machinery [skip ci]'
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1
