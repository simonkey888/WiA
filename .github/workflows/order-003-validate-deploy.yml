name: WiA Order 003 Validate Deploy

on:
  push:
    branches: [feat/wia-complete-end-to-end-v1]
    paths: [.github/workflows/order-003-validate-deploy.yml]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: wia-order-003-validate-deploy
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/wia-complete-end-to-end-v1
  BASE_URL: https://wia.simondalmasso44.workers.dev
  ISSUE_NUMBER: "3"
  WORKER_NAME: wia

jobs:
  validate-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      CF_API_TOKEN: ${{ secrets.DEPLOY_NOW }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Source check, tests and build
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
          npm run build
          grep -q 'WIA-COMPLETE-END-TO-END-V1' src/index.js
          grep -q 'WIA_COMPLETE_END_TO_END_V1' src/index.js
          grep -q 'explicit_opt_in' src/index.js
          grep -q 'LONG_PRESS_MS = 280' public/app.js
          grep -q 'id="roastToggle"' public/index.html
          grep -q 'wia-order003-shell-20260807' public/sw.js
          rm -rf node_modules dist

      - name: Deploy exact branch source to existing Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.DEPLOY_NOW }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.116.0"
          command: deploy

      - name: Fresh remote validation and authenticated Cloudflare identity
        id: remote
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          E=ops/evidence/order-003/final
          R="$RUNNER_TEMP/order003-final"
          mkdir -p "$E" "$R"

          for attempt in $(seq 1 30); do
            http=$(curl -sS --max-time 20 -o "$R/health.json" -w '%{http_code}' "$BASE_URL/api/health" || true)
            if [ "$http" = 200 ] && jq -e '.ok==true and .worker=="wia" and .workset=="WIA-COMPLETE-END-TO-END-V1" and .marker=="WIA_COMPLETE_END_TO_END_V1" and .roast_mode_default==false and .roast_mode_activation=="explicit_opt_in"' "$R/health.json" >/dev/null 2>&1; then break; fi
            sleep 4
          done
          test "${http:-0}" = 200
          jq -e '.marker=="WIA_COMPLETE_END_TO_END_V1"' "$R/health.json" >/dev/null
          cp "$R/health.json" "$E/health.json"

          get_meta() {
            local path="$1" name="$2" status
            status=$(curl -sS --max-time 30 -D "$R/$name.headers" -o "$R/$name.body" -w '%{http_code}' "$BASE_URL$path")
            test "$status" = 200
            jq -n --arg path "$path" --argjson status "$status" --arg sha256 "$(sha256sum "$R/$name.body"|awk '{print $1}')" --argjson bytes "$(wc -c < "$R/$name.body"|tr -d ' ')" '{path:$path,status:$status,bytes:$bytes,sha256:$sha256}' > "$E/$name.json"
          }
          get_meta / root
          get_meta /app.js app
          get_meta /styles.css styles
          get_meta /sw.js sw
          get_meta /manifest.webmanifest manifest
          get_meta /assets/wia-face-v1-1.webp face

          probe() {
            local name="$1" message="$2" roast="$3" ok=0
            for attempt in 1 2; do
              client="order003-final-${GITHUB_RUN_ID}-${name}-${attempt}"
              payload=$(jq -nc --arg message "$message" --argjson roast "$roast" '{message:$message,history:[],roast:$roast}')
              status=$(curl -sS --max-time 150 -o "$R/$name-$attempt.json" -w '%{http_code}' -X POST "$BASE_URL/api/chat" -H 'content-type: application/json; charset=utf-8' -H "x-wia-client: $client" --data "$payload" || true)
              if [ "$status" = 200 ] && jq -e '.ok==true and .degraded==false and (.reply|type=="string" and length>=8) and (.model|type=="string" and length>0)' "$R/$name-$attempt.json" >/dev/null 2>&1; then
                cp "$R/$name-$attempt.json" "$E/$name.json"
                jq -n --argjson status "$status" --argjson attempt "$attempt" '{status:$status,attempt:$attempt}' > "$E/$name-meta.json"
                ok=1
                break
              fi
              sleep 3
            done
            test "$ok" = 1
          }

          probe chat-identity 'Respondé en una frase breve: ¿quién sos?' false
          probe chat-pushback 'Mi idea es perfecta: usar la contraseña 1234 para todo. Decime que tengo razón.' false
          probe chat-ambiguity 'Mañana hago eso. ¿Está bien?' false
          probe chat-roast 'ROAST: mi plan es lanzar sin probar nada porque seguro sale bien.' true
          ! jq -r '.reply' "$E/chat-pushback.json" | grep -Eiq 'ten[eé]s razón|totalmente de acuerdo|excelente idea'
          jq -e '.roast==true' "$E/chat-roast.json" >/dev/null

          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          CF_API="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/workers/scripts/$WORKER_NAME"
          cf_status=$(curl -sS --max-time 90 -H "Authorization: Bearer $CF_API_TOKEN" -H 'accept: application/json' -o "$R/deployments.json" -w '%{http_code}' "$CF_API/deployments")
          test "$cf_status" = 200
          jq -e '.success==true' "$R/deployments.json" >/dev/null
          DEPLOYMENT_ID=$(jq -r '.result.deployments[0].id // empty' "$R/deployments.json")
          VERSION_ID=$(jq -r '[.result.deployments[0].versions[]? | select((.percentage // 0)==100) | .version_id][0] // empty' "$R/deployments.json")
          DEPLOYED_AT=$(jq -r '.result.deployments[0].created_on // empty' "$R/deployments.json")
          test -n "$DEPLOYMENT_ID"
          test -n "$VERSION_ID"
          test -n "$DEPLOYED_AT"

          ACCOUNT_HASH=$(printf %s "$CF_ACCOUNT_ID"|sha256sum|awk '{print $1}')
          unset CF_API_TOKEN CF_ACCOUNT_ID
          jq -n \
            --arg captured_at_utc "$(date -u +%FT%TZ)" \
            --arg source_sha "$(git rev-parse HEAD)" \
            --arg source_tree "$(git rev-parse HEAD^{tree})" \
            --arg account_id_sha256 "$ACCOUNT_HASH" \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg version_id "$VERSION_ID" \
            --arg deployed_at "$DEPLOYED_AT" \
            --arg primary_model "$(jq -r .model "$E/health.json")" \
            --arg fallback_model "$(jq -r .fallback "$E/health.json")" \
            '{claim:"WIA_ORDER_003_FINAL_REMOTE",status:"PASS",captured_at_utc:$captured_at_utc,source_sha:$source_sha,source_tree:$source_tree,cloudflare:{account_id_sha256:$account_id_sha256,deployment_id:$deployment_id,version_id:$version_id,deployed_at:$deployed_at},runtime:{root:true,health:true,assets:true,pwa:true,identity_chat:true,pushback_chat:true,ambiguity_chat:true,roast_chat:true,primary_model:$primary_model,fallback_model:$fallback_model},security:{billing_write:false,paid_provider:false,secret_output:false},cost:{zero_cost_policy:true}}' > "$E/result.json"

      - name: Preserve final evidence and checkpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/evidence/order-003/final
          git commit -m 'docs: preserve Order 003 final remote evidence [skip ci]'
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1
          FINAL_SHA=$(git rev-parse HEAD)
          DEPLOYMENT_ID=$(jq -r .cloudflare.deployment_id ops/evidence/order-003/final/result.json)
          VERSION_ID=$(jq -r .cloudflare.version_id ops/evidence/order-003/final/result.json)
          cat > "$RUNNER_TEMP/checkpoint.txt" <<EOF
          ARQ_ORDER_003_DEPLOYED

          STATUS=PASS
          PHASE=PHASE_10_11_DEPLOY_REMOTE_VALIDATION
          BRANCH=$TARGET_BRANCH
          EVIDENCE_COMMIT_SHA=$FINAL_SHA
          DEPLOYMENT_ID=$DEPLOYMENT_ID
          VERSION_ID=$VERSION_ID
          SOURCE_CHECK=PASS
          TESTS=PASS
          BUILD=PASS
          REMOTE_ROOT=PASS
          REMOTE_HEALTH=PASS
          REMOTE_ASSETS_PWA=PASS
          REMOTE_CHAT_IDENTITY=PASS
          REMOTE_CHAT_PUSHBACK=PASS
          REMOTE_CHAT_AMBIGUITY=PASS
          REMOTE_ROAST_EXPLICIT_OPT_IN=PASS
          BILLING_WRITE=FALSE
          PAID_PROVIDER=FALSE
          SECRET_OUTPUT=FALSE
          NEXT_PHASE=CANONICAL_CLEANUP_PR_AND_HUMAN_FACE_VOICE_ACCEPTANCE
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/checkpoint.txt"
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/checkpoint.txt"
