name: WiA Order 003 Model Catalog

on:
  push:
    branches: [feat/wia-complete-end-to-end-v1]
    paths: [.github/workflows/order-003-model-catalog.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_API_TOKEN: ${{ secrets.DEPLOY_NOW }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/wia-complete-end-to-end-v1
          fetch-depth: 0
      - name: Read current text-generation model catalog
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          E=ops/evidence/order-003/model-catalog
          R="$RUNNER_TEMP/order003-models.json"
          mkdir -p "$E"
          test -n "${CF_API_TOKEN:-}"
          test -n "${CF_ACCOUNT_ID:-}"
          status=$(curl -sS --max-time 90 -H "Authorization: Bearer $CF_API_TOKEN" -H 'accept: application/json' -o "$R" -w '%{http_code}' "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/ai/models/search?task=text-generation&per_page=100")
          test "$status" = 200
          jq -e '.success==true' "$R" >/dev/null
          jq '{success, result: [.result[] | {name, task, description, properties, beta, finetune, tags}]}' "$R" > "$E/catalog.json"
          jq -n --argjson http_status "$status" --arg captured_at_utc "$(date -u +%FT%TZ)" --argjson count "$(jq '.result|length' "$R")" '{http_status:$http_status,captured_at_utc:$captured_at_utc,count:$count,billing_write:false,inference_called:false}' > "$E/meta.json"
          unset CF_API_TOKEN CF_ACCOUNT_ID
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$E"
          git commit -m 'docs: preserve Order 003 Workers AI catalog [skip ci]'
          git push origin HEAD:refs/heads/feat/wia-complete-end-to-end-v1
