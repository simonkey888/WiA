name: Bootstrap WiA V1.1 Exact Source

on:
  push:
    branches:
      - feat/wia-face-voice-ux-v1-1
    paths:
      - .github/workflows/bootstrap-wia-v1-1.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bootstrap-wia-face-voice-v1-1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v6
        with:
          ref: feat/wia-face-voice-ux-v1-1
          fetch-depth: 0

      - name: Materialize deterministic source and raster assets
        shell: bash
        run: |
          set -euo pipefail
          bash ops/materialize-wia-v1-1.sh

      - name: Append bootstrap blocker to Issue 2
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/blocker.txt <<EOF
          ARQ_BOOTSTRAP_BLOCKER

          WORKSET=WIA-FACE-VOICE-UX-V1_1
          BLOCKING_GATE=GATE_1_SOURCE_BRANCH
          EXACT_ERROR=Deterministic source or raster materialization failed in GitHub Actions run $GITHUB_RUN_ID.
          CURRENT_COMMIT=$GITHUB_SHA
          RUN_URL=https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          MINIMUM_RECOVERY=Inspect the preserved bootstrap run log and correct only the failing materialization step.
          EOF
          gh issue comment 2 --repo "$GITHUB_REPOSITORY" --body-file /tmp/blocker.txt

# retry 3: content-contract validation of staged source
