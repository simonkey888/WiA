name: Deploy WiA From Default Branch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-wia-from-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-wia-default-branch
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      BASE_URL: https://wia.simondalmasso44.workers.dev
    steps:
      - name: Checkout default branch for evidence
        uses: actions/checkout@v6

      - name: Checkout exact Worker source
        uses: actions/checkout@v6
        with:
          ref: feat/wia-beta-v1
          path: app

      - name: Deploy Worker
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.DEPLOY_NOW }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.116.0"
          workingDirectory: app
          command: deploy

      - name: Verify health
        id: health
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            http=$(curl -sS --max-time 20 -o /tmp/health.json -w '%{http_code}' "$BASE_URL/api/health" || true)
            if [ "$http" = "200" ] && jq -e '.ok == true and .marker == "WIA_CF_FIRST_LIVE_001"' /tmp/health.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1

      - name: Verify real chat
        id: chat
        if: steps.deploy.outcome == 'success' && steps.health.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          http=$(curl -sS --max-time 150 -o /tmp/chat.json -w '%{http_code}' \
            -X POST "$BASE_URL/api/chat" \
            -H 'content-type: application/json; charset=utf-8' \
            --data '{"message":"Respondé en una sola frase: ¿quién sos?","history":[]}')
          test "$http" = "200"
          jq -e '.ok == true and .degraded == false and (.reply | type == "string" and length > 0) and (.model | type == "string" and length > 0)' /tmp/chat.json

      - name: Record result
        if: always()
        shell: bash
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOY_STDERR: ${{ steps.deploy.outputs.command-stderr }}
          DEPLOY_STDOUT: ${{ steps.deploy.outputs.command-output }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          CHAT_OUTCOME: ${{ steps.chat.outcome }}
        run: |
          mkdir -p ops
          node <<'NODE'
          const fs = require('fs');
          const clean = v => String(v || '').slice(0, 8000).replace(/[A-Za-z0-9_-]{30,}/g, '[REDACTED]');
          const read = p => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return null; } };
          const result = {
            claim: 'WIA-WORKERS-FIRST-DEPLOY-FROM-MAIN',
            recorded_at_utc: new Date().toISOString(),
            source_branch: 'feat/wia-beta-v1',
            source_commit: process.env.GITHUB_SHA,
            deploy: { outcome: process.env.DEPLOY_OUTCOME || 'unknown', stdout: clean(process.env.DEPLOY_STDOUT), stderr: clean(process.env.DEPLOY_STDERR) },
            health: { outcome: process.env.HEALTH_OUTCOME || 'skipped', response: read('/tmp/health.json') },
            chat: { outcome: process.env.CHAT_OUTCOME || 'skipped', response: read('/tmp/chat.json') }
          };
          result.status = result.deploy.outcome === 'success' && result.health.outcome === 'success' && result.chat.outcome === 'success' ? 'PASS' : 'BLOCKED';
          fs.writeFileSync('ops/deploy-main-result.json', JSON.stringify(result, null, 2) + '\n');
          NODE
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ops/deploy-main-result.json
          git commit -m "ops: record WiA Workers-first deploy" || true
          git push origin HEAD:main

      - name: Enforce result
        if: always()
        shell: bash
        run: jq -e '.status == "PASS"' ops/deploy-main-result.json
